version: 2
# One routine PR per directory per week, and at most one security PR per
# directory. A group applies to version updates unless it says otherwise, so
# without the `security` groups every advisory against a transitive dependency
# opened its own PR. That is how 23 PRs piled up by 2026-11 (vite, source-map-js,
# nanoid, follow-redirects and others, each once per lockfile).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      dev-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
  # The docs site and the on-chain e2e harness carry their own lockfiles. Without
  # an entry here they get security updates only, never routine ones, so a
  # transitive dependency can sit unpatched until it becomes an advisory.
  # Neither ships to consumers, so each is grouped into a single PR to keep the
  # noise down.
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      website:
        patterns:
          - "*"
      website-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e:
        patterns:
          - "*"
      e2e-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
