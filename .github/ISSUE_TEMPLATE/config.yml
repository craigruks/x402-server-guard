# Blank issues are disabled so that a suspected vulnerability cannot be filed as
# a public issue by default. GitHub adds its own "Report a security vulnerability"
# entry to the chooser while private reporting is enabled on the repository, so
# there is no link for it here: two near-identical entries at that decision point
# is worse than one. If private reporting is ever turned off, add the link back.
blank_issues_enabled: false
contact_links:
  - name: Documentation
    url: https://craigruks.github.io/x402-server-guard/
    about: The threat model, the coverage map, and the rationale for each mitigation.
